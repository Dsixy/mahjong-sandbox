<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>川流 · 麻将牌面预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#25382e;font-family:system-ui,"Noto Sans CJK SC",sans-serif}main{max-width:920px;margin:36px auto;padding:0 26px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9ded1;padding-bottom:15px}h1{font-size:24px;margin:0;font-weight:600}header a{color:#235d46;font-size:13px;text-decoration:none}p{font-size:13px;color:#758470;line-height:1.8}section{background:#fafbf5;border:1px solid #dfe3d5;border-radius:14px;margin:22px 0;padding:16px 22px 20px}h2{font-size:13px;font-weight:500;margin:0 0 15px;color:#758470}.tiles{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:12px}figure{margin:0;text-align:center}img{display:block;width:100%;max-width:64px;margin:auto;border-radius:6px;box-shadow:0 3px #c7cdbb,0 5px #356e51,0 7px 5px #18382718}figcaption{font-size:11px;margin-top:13px;color:#63775e}footer{font-size:11px;color:#819078;line-height:1.8}@media(max-width:600px){main{margin:20px auto;padding:0 12px}h1{font-size:18px}section{padding:14px 10px}.tiles{gap:5px}figcaption{font-size:9px}}
</style></head><body><main><header><h1>川流 · 麻将牌面</h1><a href="/">返回牌桌 ↗</a></header><p>万、筒、条，一至九。采用常见中式麻将的牌面排布。</p><section><h2>万子</h2><div class="tiles"><figure><img src="/assets/tiles/0.svg" alt="一万"><figcaption>一万</figcaption></figure><figure><img src="/assets/tiles/1.svg" alt="二万"><figcaption>二万</figcaption></figure><figure><img src="/assets/tiles/2.svg" alt="三万"><figcaption>三万</figcaption></figure><figure><img src="/assets/tiles/3.svg" alt="四万"><figcaption>四万</figcaption></figure><figure><img src="/assets/tiles/4.svg" alt="五万"><figcaption>五万</figcaption></figure><figure><img src="/assets/tiles/5.svg" alt="六万"><figcaption>六万</figcaption></figure><figure><img src="/assets/tiles/6.svg" alt="七万"><figcaption>七万</figcaption></figure><figure><img src="/assets/tiles/7.svg" alt="八万"><figcaption>八万</figcaption></figure><figure><img src="/assets/tiles/8.svg" alt="九万"><figcaption>九万</figcaption></figure></div></section><section><h2>筒子</h2><div class="tiles"><figure><img src="/assets/tiles/9.svg" alt="一筒"><figcaption>一筒</figcaption></figure><figure><img src="/assets/tiles/10.svg" alt="二筒"><figcaption>二筒</figcaption></figure><figure><img src="/assets/tiles/11.svg" alt="三筒"><figcaption>三筒</figcaption></figure><figure><img src="/assets/tiles/12.svg" alt="四筒"><figcaption>四筒</figcaption></figure><figure><img src="/assets/tiles/13.svg" alt="五筒"><figcaption>五筒</figcaption></figure><figure><img src="/assets/tiles/14.svg" alt="六筒"><figcaption>六筒</figcaption></figure><figure><img src="/assets/tiles/15.svg" alt="七筒"><figcaption>七筒</figcaption></figure><figure><img src="/assets/tiles/16.svg" alt="八筒"><figcaption>八筒</figcaption></figure><figure><img src="/assets/tiles/17.svg" alt="九筒"><figcaption>九筒</figcaption></figure></div></section><section><h2>条子</h2><div class="tiles"><figure><img src="/assets/tiles/18.svg" alt="一条"><figcaption>一条</figcaption></figure><figure><img src="/assets/tiles/19.svg" alt="二条"><figcaption>二条</figcaption></figure><figure><img src="/assets/tiles/20.svg" alt="三条"><figcaption>三条</figcaption></figure><figure><img src="/assets/tiles/21.svg" alt="四条"><figcaption>四条</figcaption></figure><figure><img src="/assets/tiles/22.svg" alt="五条"><figcaption>五条</figcaption></figure><figure><img src="/assets/tiles/23.svg" alt="六条"><figcaption>六条</figcaption></figure><figure><img src="/assets/tiles/24.svg" alt="七条"><figcaption>七条</figcaption></figure><figure><img src="/assets/tiles/25.svg" alt="八条"><figcaption>八条</figcaption></figure><figure><img src="/assets/tiles/26.svg" alt="九条"><figcaption>九条</figcaption></figure></div></section><section><h2>字牌</h2><div class="tiles"><figure><img src="/assets/tiles/27.svg" alt="东"><figcaption>东</figcaption></figure><figure><img src="/assets/tiles/28.svg" alt="南"><figcaption>南</figcaption></figure><figure><img src="/assets/tiles/29.svg" alt="西"><figcaption>西</figcaption></figure><figure><img src="/assets/tiles/30.svg" alt="北"><figcaption>北</figcaption></figure><figure><img src="/assets/tiles/31.svg" alt="白"><figcaption>白</figcaption></figure><figure><img src="/assets/tiles/32.svg" alt="发"><figcaption>发</figcaption></figure><figure><img src="/assets/tiles/33.svg" alt="中"><figcaption>中</figcaption></figure></div></section><section><h2>赤五</h2><div class="tiles"><figure><img src="/assets/tiles/4-red.svg" alt="赤五万"><figcaption>赤五万</figcaption></figure><figure><img src="/assets/tiles/13-red.svg" alt="赤五筒"><figcaption>赤五筒</figcaption></figure><figure><img src="/assets/tiles/22-red.svg" alt="赤五条"><figcaption>赤五条</figcaption></figure></div></section><footer>二筒：上下同绿；三筒：蓝、红、蓝斜列；六筒：上二下四；七筒：上方斜列三点。<br>三条呈三角排列；七条为上红一、下绿六；八条为上下相对的竹节；九条中列为红色。</footer></main></body></html>
